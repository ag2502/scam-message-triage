[project]
name = "scam-message-triage"
version = "0.3.0"
description = "Explainable scam-message triage for instant-payment fraud (Pix, UPI, Zelle, SPEI, bank transfer...)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Amogh Gaikwad", email = "amogh.g2003@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scam-triage = "scam_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scam_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
